apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgemind-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/forgemind/forgemind-infrastructure.git'
    targetRevision: main
    path: helm/forgemind
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: forgemind-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
