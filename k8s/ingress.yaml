apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgemind-ingress
  namespace: forgemind
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.forgemind.dev"
spec:
  ingressClassName: nginx
  rules:
    - host: api.forgemind.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgemind-backend
                port:
                  number: 8080
    - host: app.forgemind.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forgemind-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - api.forgemind.dev
        - app.forgemind.dev
      secretName: forgemind-tls
