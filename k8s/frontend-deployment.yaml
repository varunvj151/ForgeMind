apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgemind-frontend
  namespace: forgemind
  labels:
    app: forgemind-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgemind-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: forgemind-frontend
    spec:
      containers:
        - name: forgemind-frontend
          image: forgemind/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
